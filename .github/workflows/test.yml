name: TrueHomes Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'truehomes-app/package-lock.json'

      - name: Install Dependencies
        working-directory: truehomes-app
        run: npm ci

      - name: Run Cybersecurity & Integration Suite
        working-directory: truehomes-app
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/truehomes_test
          JWT_SECRET: test_jwt_secret_must_be_at_least_32_characters_long_for_truehomes
          PORT: 5000
          ADMIN_EMAIL: admin@truehomes.test
        run: npm test
